name: Verify production error handling

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build
      - run: |
          npx next start -H 127.0.0.1 -p 3000 > /tmp/next-start.log 2>&1 &
          pid=$!
          sleep 3
          kill $pid
          wait $pid || test $? -eq 143
          cat /tmp/next-start.log
